name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v4

      - name: 安装 Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 首次构建时自动生成固定签名密钥并提交回仓库,
      # 保证后续每次构建 APK 签名一致,可以直接覆盖安装(歌单数据不丢)。
      - name: 生成签名密钥(仅首次)
        run: |
          if [ ! -f keystore.jks ]; then
            keytool -genkeypair -v -keystore keystore.jks -alias shiyin \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass shiyin2026 -keypass shiyin2026 \
              -dname "CN=Shiyin, OU=Shiyin, O=Shiyin, L=NA, ST=NA, C=CN"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keystore.jks
            git commit -m "chore: 自动生成 APK 签名密钥"
            git push
          fi

      - name: 构建 Release APK
        run: gradle assembleRelease --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: Shiyin-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
