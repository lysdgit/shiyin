name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v4

      - name: 安装 Gradle 9.9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.1'

      # 首次构建时自动生成固定签名密钥并提交回仓库,
      # 保证后续每次构建 APK 签名一致,可以直接覆盖安装(歌单数据不丢)。
      - name: 生成签名密钥(仅首次)
        run: |
          if [ ! -f keystore.jks ]; then
            keytool -genkeypair -v -keystore keystore.jks -alias shiyin \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass shiyin2026 -keypass shiyin2026 \
              -dname "CN=Shiyin, OU=Shiyin, O=Shiyin, L=NA, ST=NA, C=CN"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keystore.jks
            git commit -m "chore: 自动生成 APK 签名密钥"
            git push
          fi

      - name: 读取版本号
        id: ver
        run: echo "ver=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: 构建 Release APK
        run: gradle assembleRelease --no-daemon 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      # 构建失败时把 Kotlin 编译错误提取到运行页顶部 Summary,免翻日志
      - name: 失败时输出诊断信息
        if: failure()
        run: |
          if [ -f build.log ]; then
            echo "### 构建日志尾部 45 行" >> $GITHUB_STEP_SUMMARY
            tail -n 45 build.log >> $GITHUB_STEP_SUMMARY
            TAIL=$(tail -n 45 build.log)
            TESC=$(echo "$TAIL" | sed ':a;N;$!ba;s/
/%0A/g')
            echo "::error::构建失败,日志尾部:$TESC"
          fi
        if: failure()
        run: |
          if [ -f build.log ]; then
            echo "### 编译/构建错误" >> $GITHUB_STEP_SUMMARY
            grep -E "^e: |error: |What went wrong" build.log | head -40 >> $GITHUB_STEP_SUMMARY || echo "(未匹配到具体错误行,请展开上面的构建步骤查看完整日志)" >> $GITHUB_STEP_SUMMARY
            grep -E "^e: |error: " build.log | head -40 > ci-errors.txt || true
            if [ -s ci-errors.txt ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add ci-errors.txt
              git commit -m "ci: 自动记录编译错误(供开发排查)"
              git push
            fi
          fi

      - name: 上传 APK(压缩包形式)
        uses: actions/upload-artifact@v7
        with:
          name: Shiyin-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # 发布到 Releases:直接下载裸 APK,不用解压、不用登录
      - name: 发布 APK 到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.ver }}
          name: 拾音 v${{ steps.ver.outputs.ver }}
          files: app/build/outputs/apk/release/*.apk
          body: |
            应用版本 ${{ steps.ver.outputs.ver }}(构建 #${{ github.run_number }})
            下载 **Shiyin-release.apk** 直接安装即可(此文件不是压缩包)

      - name: 版本号递增并提交回仓库(供下次构建使用)
        if: success()
        run: |
          NEW=$(awk -F. '{printf "%d.%d", $1, $2+1}' VERSION)
          echo "$NEW" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "ci: 版本号递增至 v$NEW"
          git push
